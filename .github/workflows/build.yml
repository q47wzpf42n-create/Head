name: SwipePatcher Build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  THEOS:                ${{ github.workspace }}/theos
  THEOS_PACKAGE_SCHEME: rootless
  THEOS_DEVICE_IP:      ''
  THEOS_DEVICE_PORT:    ''

jobs:
  build:
    runs-on: macos-14

    steps:
      # ── 1. Source ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. System deps ─────────────────────────────────────────────────────
      - name: Install brew dependencies
        run: |
          brew update --quiet
          brew install ldid dpkg --quiet

      # ── 3. Theos ───────────────────────────────────────────────────────────
      - name: Clone Theos
        run: |
          git clone --recursive \
            https://github.com/theos/theos.git \
            "$THEOS"

      # ── 4. iOS SDK ─────────────────────────────────────────────────────────
      - name: Install iOS SDK
        run: |
          mkdir -p "$THEOS/sdks"

          # Scrape the actual latest release tag from GitHub releases page
          # (avoids GitHub API rate limits entirely — no token needed)
          RELEASE_TAG=$(curl -sfL \
            -H "User-Agent: Mozilla/5.0" \
            "https://github.com/theos/sdks/releases" \
            | grep -oE 'href="[^"]*iPhoneOS[0-9]+\.[0-9]+\.sdk\.tar\.xz"' \
            | head -1 \
            | grep -oE 'download/[^/]+' \
            | sed 's|download/||')

          echo "Detected release tag: $RELEASE_TAG"

          # Ordered preference: newest to oldest — all confirmed real filenames
          SDKS=(
            "iPhoneOS16.5"
            "iPhoneOS15.6"
            "iPhoneOS14.5"
            "iPhoneOS13.7"
          )

          download_sdk() {
            local TAG="$1"
            local NAME="$2"
            local URL="https://github.com/theos/sdks/releases/download/${TAG}/${NAME}.sdk.tar.xz"
            echo "→ Trying: $URL"
            curl -fL \
              --retry 3 \
              --retry-delay 5 \
              --connect-timeout 30 \
              --max-time 300 \
              -H "User-Agent: Mozilla/5.0" \
              "$URL" -o /tmp/sdk.tar.xz 2>&1 || return 1
            echo "→ Extracting..."
            tar xJf /tmp/sdk.tar.xz -C "$THEOS/sdks/" || return 1
            rm -f /tmp/sdk.tar.xz
            echo "✓ SDK installed: $NAME from tag $TAG"
            return 0
          }

          SUCCESS=0

          # Try scraped tag first (always up-to-date)
          if [ -n "$RELEASE_TAG" ]; then
            for SDK in "${SDKS[@]}"; do
              download_sdk "$RELEASE_TAG" "$SDK" && SUCCESS=1 && break
            done
          fi

          # Hard fallback with confirmed working tag
          if [ "$SUCCESS" -eq 0 ]; then
            echo "Scrape failed — falling back to known tag: master-146e41f"
            for SDK in "${SDKS[@]}"; do
              download_sdk "master-146e41f" "$SDK" && SUCCESS=1 && break
            done
          fi

          if [ "$SUCCESS" -eq 0 ]; then
            echo "FATAL: all SDK download attempts failed" >&2
            exit 1
          fi

          echo "── Available SDKs ──"
          ls "$THEOS/sdks/"

      # ── 5. Build ───────────────────────────────────────────────────────────
      - name: Build .deb package
        run: |
          make package \
            FINALPACKAGE=1 \
            STRIP=1 \
            THEOS="$THEOS" \
            THEOS_PACKAGE_SCHEME=rootless

      # ── 6. Verify ──────────────────────────────────────────────────────────
      - name: Verify package
        run: |
          ls -lh packages/*.deb
          echo "✓ Build complete"

      # ── 7. Upload ──────────────────────────────────────────────────────────
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: SwipePatcher-deb
          path: packages/*.deb
          retention-days: 14
          if-no-files-found: error
